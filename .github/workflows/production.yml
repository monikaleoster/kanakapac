name: Deploy to Production

on:
  push:
    tags:
      - "v*"

jobs:
  migrate-production-db:
    name: Migrate Production Database
    runs-on: ubuntu-latest
    environment: production   # requires manual approval in GitHub
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client

      - name: Apply all migrations in order
        run: |
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "Applying $f..."
            psql ${{ secrets.PROD_DATABASE_URL }} -f "$f" -v ON_ERROR_STOP=1
          done

      - name: Reload PostgREST schema cache
        run: psql ${{ secrets.PROD_DATABASE_URL }} -c "NOTIFY pgrst, 'reload schema';"

  deploy-production:
    name: Deploy to Vercel Production
    runs-on: ubuntu-latest
    needs: migrate-production-db
    environment:
      name: production
      url: https://kanakapac.ca
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment (downloads production secrets from Vercel)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for Vercel
        # Runtime secrets come from `vercel pull` above — no duplication needed
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel Production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
