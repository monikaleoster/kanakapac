name: CI

on:
  push:
    branches: [main, "feature/**", "claude/**"]
  pull_request:
    branches: [main, "feature/**", "claude/**"]

jobs:
  test-migrations:
    name: Test DB Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client

      - name: Apply all migrations in order
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb
        run: |
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "Applying $f..."
            psql "$DATABASE_URL" -f "$f" -v ON_ERROR_STOP=1
          done

      - name: Verify expected tables exist
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb
        run: |
          psql "$DATABASE_URL" -c "\dt" | grep -E "events|rsvps|minutes|announcements|policies|team_members|subscribers|settings"
          psql "$DATABASE_URL" -c "\d events" | grep -E "rsvp_enabled|ticket_url"

  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npx tsc --noEmit

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Jest
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests]
    env:
      # Placeholder values — build does not query the DB at build time
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: placeholder-key
      DATABASE_URL: postgresql://postgres:placeholder@localhost:5432/postgres
      NEXTAUTH_SECRET: ci-secret-not-used-in-production
      NEXTAUTH_URL: http://localhost:3000
      ADMIN_PASSWORD: ci-test-password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next/
          retention-days: 1

  # The jobs below only run for feature/claude branches and their PRs — never
  # for a push directly to main, which only needs the quality gates above.
  # Production is a separate, manually-triggered workflow (production.yml).

  migrate-staging-db:
    name: Migrate Staging Database
    runs-on: ubuntu-latest
    needs: [test-migrations, lint-and-typecheck, unit-tests, build]
    if: github.ref != 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Migrate staging database
        uses: ./.github/actions/migrate-db
        with:
          database-url: ${{ secrets.CI_DATABASE_URL }}

  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: migrate-staging-db
    if: github.ref != 'refs/heads/main'
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    environment:
      name: Preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        id: deploy
        uses: ./.github/actions/vercel-deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          environment: preview

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ Preview deploy ready: ${{ steps.deploy.outputs.url }}`
            })

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: deploy-preview
    if: github.ref != 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: e2etest/package-lock.json

      - name: Install Playwright dependencies
        working-directory: e2etest
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2etest
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: e2etest
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy-preview.outputs.url }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2etest/playwright-report/
          retention-days: 7
