name: CI

on:
  push:
    branches: [main, "feature/**", "claude/**"]
  pull_request:
    branches: [main, "feature/**", "claude/**"]

jobs:
  test-migrations:
    name: Test DB Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client

      - name: Apply all migrations in order
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb
        run: |
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "Applying $f..."
            psql "$DATABASE_URL" -f "$f" -v ON_ERROR_STOP=1
          done

      - name: Verify expected tables exist
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb
        run: |
          psql "$DATABASE_URL" -c "\dt" | grep -E "events|rsvps|minutes|announcements|policies|team_members|subscribers|settings"
          psql "$DATABASE_URL" -c "\d events" | grep -E "rsvp_enabled|ticket_url"

  migrate-staging-db:
    name: Migrate Staging Database
    runs-on: ubuntu-latest
    needs: test-migrations
    # Skip on main — staging.yml handles that push
    if: github.ref != 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client

      - name: Apply all migrations to staging Supabase
        run: |
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "Applying $f..."
            psql "${{ secrets.CI_DATABASE_URL }}" -f "$f" -v ON_ERROR_STOP=1
          done

      - name: Reload PostgREST schema cache
        run: psql "${{ secrets.CI_DATABASE_URL }}" -c "NOTIFY pgrst, 'reload schema';"

  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npx tsc --noEmit

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    env:
      # Placeholder values — build does not query the DB at build time
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: placeholder-key
      DATABASE_URL: postgresql://postgres:placeholder@localhost:5432/postgres
      NEXTAUTH_SECRET: ci-secret-not-used-in-production
      NEXTAUTH_URL: http://localhost:3000
      ADMIN_PASSWORD: ci-test-password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next/
          retention-days: 1
